<body data-api-base="/api" data-legacy-base="">

      <nav class="primary-nav" aria-label="主导航">
        <a href="#desk" data-route="desk" aria-label="运营"><span class="icon i-squares-four" aria-hidden="true"></span><span>运营</span></a>
        <a href="#works" data-route="works" aria-label="资产库"><span class="icon i-folder-open" aria-hidden="true"></span><span>资产库</span></a>
        <a href="#notes" data-route="notes" aria-label="便签"><span class="icon i-note" aria-hidden="true"></span><span>便签</span></a>
        <a href="#analytics" data-route="analytics" aria-label="数据"><span class="icon i-chart-line" aria-hidden="true"></span><span>数据</span></a>

      </nav>
    </aside>
    <div class="workspace-content">
      <header class="topbar">
        <button class="toolbar-search" type="button" data-action="global-search" aria-haspopup="dialog" aria-keyshortcuts="Meta+K" title="跳转页面、搜索资产、新建便签 ⌘ K"><span class="icon i-magnifying-glass" aria-hidden="true"></span><span>搜索资产</span></button>
        <button class="button toolbar-refresh" type="button" data-action="refresh" aria-label="刷新：重新读取工作区和运营资料" title="重新读取工作区里的文件和运营资料"><span class="icon i-arrow-clockwise" aria-hidden="true"></span><span>刷新</span></button>
      </header>
      <div class="offline-banner" id="offline-banner" role="status" hidden><span class="icon i-warning-circle" aria-hidden="true"></span><p>连不上 SPT 本机服务。</p><button type="button" class="button small" data-action="retry-connect">重试</button></div>
      <div class="body-layout">
        <main id="view" tabindex="-1"><header class="page-heading"><div><h1 tabindex="-1">运营</h1></div></header><div class="dashboard-skeleton" aria-busy="true" aria-label="正在读取"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div></main>
        <section id="tool-host" class="tool-host" aria-label="发布工具" hidden></section>
      </div>
      <footer class="app-footer"><span id="connection-text">连接中</span><span id="source-path" hidden>SPT / 工作区</span><span id="sync-time"></span></footer>
    </div>
  </div>
  <template id="library-template">
    <section class="library" aria-labelledby="library-title">
      <header class="page-heading library-heading"><h1 id="library-title" tabindex="-1">资产库</h1><div id="kind-slot"></div><div class="page-controls"><div id="export-slot"></div></div></header>
      <div class="library-toolbar">
        <div class="search"><span class="icon i-magnifying-glass" aria-hidden="true"></span><label class="sr-only" for="search">搜索资产库</label><input id="search" type="search" placeholder="搜索资产库" autocomplete="off"></div>
        <p class="library-status"><span class="result-count" id="result-count" role="status">读取中</span></p>
        <div class="toolbar-controls"><span data-listbox-slot="status-filter"></span><span data-listbox-slot="cover-ratio"></span><div class="view-switch" role="group" aria-label="网格或列表"><button type="button" id="grid-view" class="icon-button selected" title="网格视图" aria-label="网格视图" aria-pressed="true"><span class="icon i-squares-four" aria-hidden="true"></span></button><button type="button" id="list-view" class="icon-button" title="列表视图" aria-label="列表视图" aria-pressed="false"><span class="icon i-list-bullets" aria-hidden="true"></span></button></div></div>
      </div>
      <nav class="category-nav" id="category-nav" aria-label="分组"></nav>
      <div class="inline-message" id="library-message" role="status" hidden></div>
      <div id="work-results" aria-busy="true"></div>
    </section>
  </template>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <dialog id="note-dialog" class="note-dialog" aria-labelledby="note-dialog-title"><div id="note-dialog-content"></div></dialog>
  <dialog id="post-dialog" class="post-dialog" aria-labelledby="post-dialog-title"><div id="post-dialog-content"></div></dialog>
  <dialog id="palette" class="palette" aria-label="命令面板">
    <div class="palette-field"><span class="icon i-magnifying-glass" aria-hidden="true"></span><input id="palette-input" type="text" role="combobox" aria-label="跳转页面、搜索资产、新建便签" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" placeholder="跳转页面、搜索资产、新建便签" autocomplete="off" spellcheck="false"></div>
    <ul id="palette-list" class="palette-list" role="listbox" aria-label="结果"></ul>
    <p class="palette-empty" hidden></p>
  </dialog>
  <div class="toast-region" id="notice" aria-live="polite"></div>
