name: Windows and macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      SPT_SKIP_INSTALLED_SKILLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt
      - name: Install fixture browser
        run: python -m playwright install chromium --only-shell
      - name: Confirm real fixture browser is available
        run: python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()"
      - name: Check uploaded file privacy
        run: python scripts/check_distribution.py --tracked
      - name: Asset library and data contracts
        run: python -m unittest discover -s spt/server/tests -t . -q
      - name: Application and Windows browser fixtures
        run: python -m unittest discover -s tests -p "test_*.py" -q
      - name: Interface contracts
        run: python scripts/run_frontend_checks.py
      - name: Fresh installation startup
        run: python scripts/smoke_test.py
      - name: Verify Windows installer and bundled video tool
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call 安装Windows.bat <NUL
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -c "import yaml, PIL, playwright"
          if errorlevel 1 exit /b 1
          .venv\Scripts\ffmpeg.exe -version
